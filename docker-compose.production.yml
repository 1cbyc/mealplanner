# Production Docker Compose for MealPlanner
# Use: docker-compose -f docker-compose.yml -f docker-compose.production.yml up -d

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.production
    environment:
      NODE_ENV: production
    # In production, you might want to remove port mapping and use reverse proxy
    # ports:
    #   - "127.0.0.1:4000:4000"
    # Instead, use internal networking
    networks:
      - mealplanner-network
      - nginx-proxy  # If using nginx proxy
  
  # Optional: Add nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    container_name: mealplanner-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro  # For SSL certificates
    depends_on:
      - backend
    networks:
      - mealplanner-network

networks:
  nginx-proxy:
    external: true  # Use existing proxy network if available